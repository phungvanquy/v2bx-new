name: Test scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: for script in install.sh scripts/*.sh; do bash -n "$script"; done

      - name: Run ShellCheck
        run: shellcheck --severity=error install.sh scripts/install.sh scripts/V2bX.sh scripts/initconfig.sh scripts/elise.sh scripts/test-separation.sh

      - name: Test project separation
        run: bash scripts/test-separation.sh
