name: Release

on:
  push:
    branches:
      - feature/elise-single-repo
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  elise-check:
    name: Check Elise Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        working-directory: rust/elise
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: rust/elise
        run: cargo clippy --locked --all-targets --all-features
      - name: Run Rust tests
        working-directory: rust/elise
        run: cargo test --locked --all
      - name: Test installer contract
        run: bash scripts/test-elise.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: "64"
          - goos: linux
            goarch: arm64
            asset_arch: arm64-v8a
          - goos: linux
            goarch: s390x
            asset_arch: s390x

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          archive="V2bX-${GOOS}-${{ matrix.asset_arch }}.zip"
          package_dir="dist/package"

          mkdir -p "${package_dir}"
          GOEXPERIMENT=jsonv2 go build \
            -trimpath \
            -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" \
            -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=${version}' -s -w -buildid=" \
            -o "${package_dir}/V2bX" .

          cp README.md LICENSE "${package_dir}/"
          cp example/config.json example/custom_inbound.json example/custom_outbound.json \
            example/dns.json example/geoip.dat example/geosite.dat example/route.json \
            "${package_dir}/"

          chmod +x "${package_dir}/V2bX"
          (
            cd "${package_dir}"
            zip -9 "../${archive}" ./*
          )

          cd dist
          {
            printf 'MD5= %s\n' "$(md5sum "${archive}" | awk '{print $1}')"
            printf 'SHA1= %s\n' "$(sha1sum "${archive}" | awk '{print $1}')"
            printf 'SHA2-256= %s\n' "$(sha256sum "${archive}" | awk '{print $1}')"
            printf 'SHA2-512= %s\n' "$(sha512sum "${archive}" | awk '{print $1}')"
          } > "${archive}.dgst"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ matrix.goos }}-${{ matrix.asset_arch }}
          path: |
            dist/*.zip
            dist/*.dgst
          if-no-files-found: error

  elise:
    needs: elise-check
    name: Build Elise ${{ matrix.asset_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_arch: amd64
          - target: aarch64-unknown-linux-musl
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build Rust core
        working-directory: rust/elise
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package Rust core
        run: bash scripts/package-elise.sh rust/elise/target/${{ matrix.target }}/release/elise ${{ matrix.asset_arch }} dist
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: elise-linux-${{ matrix.asset_arch }}
          path: |
            dist/elise-linux-${{ matrix.asset_arch }}.tar.gz
            dist/elise-linux-${{ matrix.asset_arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, elise]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "V2bX ${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "V2bX ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
